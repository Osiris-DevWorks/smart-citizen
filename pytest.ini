[pytest]
# Pytest configuration. Lives at the project root (not under tests/) so
# pytest's rootdir discovery resolves to the repo root — the `pythonpath`
# entries below are relative to rootdir, and putting the file under
# tests/ would make `.` resolve to `tests/` and break `from src.X`
# imports under bare `pytest tests/` invocations (CI uses that form;
# `python -m pytest` masked the bug locally because Python's -m flag
# always adds CWD to sys.path).

# Minimum version
minversion = 6.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may use file I/O, external tools)
    slow: Slow running tests (P4K extraction, large file operations)
    critical: Critical features that must pass (data loading, merging, stats, apply)
    regression: Tests for previously found bugs

# Coverage options (if coverage.py installed)
# --cov=src --cov-report=html --cov-report=term

# Test paths
testpaths = tests

# Timeout for tests (in seconds)
# timeout = 300

# Python path
# The project root only, for `from src.X` imports (the style src/ uses). src/
# itself is not on the path, so a short `from utils.X` import fails instead of
# loading a second copy of the module (#510).
pythonpath = .
