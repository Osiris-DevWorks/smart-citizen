name: Release

# Three trigger paths, all converging on the same build-and-publish job:
#
#   1. Push to main / master — the primary release event. Workflow reads
#      VERSION.TXT, derives the tag (`v{VERSION}`), checks if a release
#      with that tag already exists, and skips if it does. So merging
#      a non-version-bump PR into main is a no-op; merging a PR that
#      bumps VERSION.TXT triggers a release. Workflow auto-creates and
#      pushes the tag from the merge commit.
#   2. Push of a v*.*.* tag — explicit re-release path. Skips the
#      "does the release already exist" check; always proceeds. Useful
#      if you want to retag and rebuild deliberately.
#   3. workflow_dispatch — manual trigger for one-off rebuilds against
#      an existing tag (e.g. if the first attempt failed mid-publish).
#
# Builds BOTH the standard installer AND the portable zip, attaches both
# to the GitHub Release. The existing release-notify.yml workflow fires
# on `release: published` and posts the Discord notification — no change
# needed there.

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for (e.g. v1.3.0)"
        required: true
        type: string

jobs:
  build-and-release:
    name: Build & Release
    runs-on: windows-latest
    timeout-minutes: 30
    # A fixed environment name gives the Azure federated credential one
    # subject to trust (repo:Osiris-DevWorks/smart-citizen:environment:release)
    # whichever of the three triggers started the run.
    environment: release
    permissions:
      # Required for: softprops/action-gh-release (create release + upload
      # assets) AND `git push origin <tag>` (auto-tag the merge commit on
      # branch-push trigger).
      contents: write
      # Required for the Azure OIDC login that code signing uses, and for
      # the build provenance attestation.
      id-token: write
      attestations: write
    # Code signing (Azure Artifact Signing) runs only once the
    # AZURE_SIGNING_ACCOUNT repository variable is set. Until then every
    # signing step is skipped and the release ships unsigned, as before.
    # Repository variables it reads (none are secret): AZURE_CLIENT_ID,
    # AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_SIGNING_ENDPOINT
    # (e.g. https://weu.codesigning.azure.net/), AZURE_SIGNING_ACCOUNT,
    # AZURE_SIGNING_PROFILE.
    env:
      SIGN: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
      VT_KEY_SET: ${{ secrets.VIRUSTOTAL_API_KEY != '' }}

    steps:
      - name: Checkout (at tag, branch HEAD, or dispatch input)
        uses: actions/checkout@v4
        with:
          # On tag push: github.ref is the tag. On branch push: it's the
          # branch HEAD. On workflow_dispatch: use the explicit input.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          # Need write-capable auth so we can push the auto-created tag
          # back to origin on the branch-push path.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve trigger + tag + version
        # Three trigger paths, three resolution rules. Branch-push reads
        # VERSION.TXT to derive the tag (`v{VERSION}`); tag-push and
        # workflow_dispatch use the tag verbatim.
        id: resolve
        shell: pwsh
        run: |
          $eventName = "${{ github.event_name }}"
          $refType   = "${{ github.ref_type }}"
          if ($eventName -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
            $trigger = "dispatch"
          } elseif ($refType -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $trigger = "tag"
          } else {
            $version_raw = (Get-Content VERSION.TXT).Trim()
            $tag = "v$version_raw"
            $trigger = "branch"
          }
          $version = $tag -replace "^v", ""
          Write-Host "Trigger: $trigger | Tag: $tag | Version: $version"
          "tag=$tag"         | Out-File -Append $env:GITHUB_OUTPUT
          "version=$version" | Out-File -Append $env:GITHUB_OUTPUT
          "trigger=$trigger" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Skip if release already exists (branch-push only)
        # Branch-push fires on EVERY merge to main, including doc-only or
        # bug-fix merges that don't bump VERSION.TXT. Skip the release
        # in that case so we don't try to overwrite the existing one.
        # Tag-push and workflow_dispatch always proceed — caller intent
        # is explicit.
        id: gate
        shell: pwsh
        run: |
          $trigger = "${{ steps.resolve.outputs.trigger }}"
          $tag = "${{ steps.resolve.outputs.tag }}"
          if ($trigger -ne "branch") {
            Write-Host "Trigger=$trigger — proceed unconditionally"
            "skip=false" | Out-File -Append $env:GITHUB_OUTPUT
            exit 0
          }
          # gh release view returns non-zero when the release doesn't
          # exist — that's the expected "go publish" signal. Capture
          # the exit code, branch on it, then explicitly exit 0 so
          # PowerShell doesn't carry the non-zero $LASTEXITCODE forward
          # and fail the whole step (GitHub Actions runs each pwsh
          # script as a child process and fails the step if it returns
          # non-zero at end of script).
          $existing = gh release view $tag --repo "${{ github.repository }}" 2>$null
          $existsCode = $LASTEXITCODE
          if ($existsCode -eq 0) {
            Write-Host "Release $tag already exists — skipping (no version bump in this push)"
            "skip=true" | Out-File -Append $env:GITHUB_OUTPUT
          } else {
            Write-Host "No release for $tag yet — proceeding to build + publish"
            "skip=false" | Out-File -Append $env:GITHUB_OUTPUT
          }
          exit 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify VERSION.TXT matches tag
        if: steps.gate.outputs.skip == 'false'
        shell: pwsh
        run: |
          $expected = "${{ steps.resolve.outputs.version }}"
          $actual = (Get-Content VERSION.TXT).Trim()
          if ($expected -ne $actual) {
            Write-Error "Tag version ($expected) does not match VERSION.TXT ($actual). Bump VERSION.TXT and re-tag."
            exit 1
          }
          Write-Host "VERSION.TXT matches tag: $actual"

      - name: Set up Python 3.11
        if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        if: steps.gate.outputs.skip == 'false'
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # See ci.yml for the same `python -m pytest` rationale (CWD on
        # sys.path independent of pytest.ini pythonpath resolution).
        if: steps.gate.outputs.skip == 'false'
        run: |
          python -m pytest tests/ `
            --deselect tests/test_pak_extraction.py::TestDataForgeCache `
            -q

      - name: Build standard PyInstaller onedir
        if: steps.gate.outputs.skip == 'false'
        run: python scripts/build/build_exe.py

      - name: Azure login (code signing)
        if: steps.gate.outputs.skip == 'false' && env.SIGN == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign program files (SmartCitizen.exe, unp4k, unforge)
        if: steps.gate.outputs.skip == 'false' && env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\SmartCitizen
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install Inno Setup
        if: steps.gate.outputs.skip == 'false'
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile installer
        if: steps.gate.outputs.skip == 'false'
        shell: pwsh
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe not found at $iscc — Inno Setup install failed?"
            exit 1
          }
          if ($env:SIGN -eq 'true') {
            # Inno signs Setup.exe and the uninstaller itself, so the
            # uninstaller it writes into the install folder is signed too.
            $signScript = Join-Path $env:GITHUB_WORKSPACE "scripts\build\sign_file.ps1"
            & $iscc /DSIGN "/Sazure=pwsh -NoProfile -ExecutionPolicy Bypass -File `"$signScript`" `$f" installer.iss
          } else {
            & $iscc installer.iss
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compile failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Stash standard installer before portable rebuild
        # build_exe.py unconditionally rmtrees `dist/` at the start of
        # every run (including --portable). Without stashing, the
        # standard installer compiled in the previous step gets wiped
        # by the portable build and the verify step downstream errors
        # with "Missing artifacts: dist/SmartCitizen-X.Y.Z-Setup.exe".
        # Move it out, do the portable build, move it back.
        if: steps.gate.outputs.skip == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.resolve.outputs.version }}"
          $installer = "dist/SmartCitizen-${version}-Setup.exe"
          New-Item -ItemType Directory -Path .artifacts-stash -Force | Out-Null
          Move-Item $installer ".artifacts-stash/SmartCitizen-${version}-Setup.exe"
          Write-Host "Stashed installer to .artifacts-stash/"

      - name: Build portable variant
        # Cleans dist/ + builds the same source tree with --portable, which
        # writes src/utils/_build_info.py with IS_PORTABLE=True before
        # PyInstaller runs and packages the result as a zip. The build
        # script removes _build_info.py in its finally block.
        if: steps.gate.outputs.skip == 'false'
        run: python scripts/build/build_exe.py --portable

      - name: Sign portable program files
        if: steps.gate.outputs.skip == 'false' && env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\SmartCitizen-Portable-v${{ steps.resolve.outputs.version }}
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Zip signed portable build again
        # build_exe.py --portable zipped the folder before it was signed.
        if: steps.gate.outputs.skip == 'false' && env.SIGN == 'true'
        run: python scripts/build/build_exe.py --portable --zip-only

      - name: Restore standard installer
        # Move the stashed installer back into dist/ so both artifacts
        # sit alongside each other for the verify + publish steps.
        if: steps.gate.outputs.skip == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.resolve.outputs.version }}"
          Move-Item ".artifacts-stash/SmartCitizen-${version}-Setup.exe" "dist/SmartCitizen-${version}-Setup.exe"
          Write-Host "Restored installer to dist/"

      - name: Verify both artifacts exist
        if: steps.gate.outputs.skip == 'false'
        id: artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.resolve.outputs.version }}"
          $installer = "dist/SmartCitizen-${version}-Setup.exe"
          $portable  = "dist/SmartCitizen-Portable-v${version}.zip"
          $missing = @()
          if (-not (Test-Path $installer)) { $missing += $installer }
          if (-not (Test-Path $portable))  { $missing += $portable }
          if ($missing.Count -gt 0) {
            Write-Error "Missing artifacts: $($missing -join ', ')"
            Get-ChildItem dist -Recurse -Depth 2 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Installer: $installer ($((Get-Item $installer).Length) bytes)"
          Write-Host "Portable:  $portable ($((Get-Item $portable).Length) bytes)"
          "installer_path=$installer" | Out-File -Append $env:GITHUB_OUTPUT
          "portable_path=$portable"   | Out-File -Append $env:GITHUB_OUTPUT

      - name: Resolve release notes
        if: steps.gate.outputs.skip == 'false'
        id: notes
        shell: pwsh
        run: |
          $version = "${{ steps.resolve.outputs.version }}"
          # Release notes live in docs/ after the 1.4.1 cleanup; older
          # releases keep them at the repo root. Check docs/ first so the
          # next release picks up the new home, then fall back to root so
          # historical re-runs (workflow_dispatch against a pre-cleanup
          # tag) still find the right file.
          $notes_file = "docs/${version}-RELEASE-NOTES.md"
          if (-not (Test-Path $notes_file)) {
            $notes_file = "${version}-RELEASE-NOTES.md"
          }
          if (Test-Path $notes_file) {
            Write-Host "Using release notes from $notes_file"
            "notes_file=$notes_file" | Out-File -Append $env:GITHUB_OUTPUT
          } else {
            Write-Host "No release notes file found; release will use the auto-generated body"
            "notes_file=" | Out-File -Append $env:GITHUB_OUTPUT
          }

      - name: Create + push tag (branch-push only)
        # On branch push we need to tag the merge commit so the published
        # release has a tag to point at. Tag/dispatch triggers already
        # have one. Pushing tags via GITHUB_TOKEN does NOT recursively
        # trigger this workflow (that's GitHub's built-in safety against
        # workflow loops with the default token).
        #
        # Idempotent: a manually-pushed tag (e.g. someone ran ``git push
        # origin v1.3.1`` after merging the release PR) races with this
        # workflow's branch-push trigger, and ``git push origin $tag``
        # would fail with ``! [rejected] ... (already exists)`` and red-X
        # the workflow run even though the parallel tag-push run will
        # publish the release fine. Pre-check origin and bail out cleanly.
        if: steps.gate.outputs.skip == 'false' && steps.resolve.outputs.trigger == 'branch'
        shell: pwsh
        run: |
          $tag = "${{ steps.resolve.outputs.tag }}"
          $exists = git ls-remote --tags origin "refs/tags/$tag"
          if ($exists) {
            Write-Host "Tag $tag already exists on origin — skipping auto-tag step"
            exit 0
          }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag -m "Release $tag (auto-tagged by release.yml on merge to ${{ github.ref_name }})"
          git push origin $tag

      - name: Attest build provenance
        # Records that these exact files were built by this workflow from
        # this commit. Anyone can check a download with
        # `gh attestation verify <file> --repo Osiris-DevWorks/smart-citizen`.
        if: steps.gate.outputs.skip == 'false'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ steps.artifacts.outputs.installer_path }}
            ${{ steps.artifacts.outputs.portable_path }}

      - name: Publish GitHub Release
        if: steps.gate.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: "Smart Citizen ${{ steps.resolve.outputs.tag }}"
          body_path: ${{ steps.notes.outputs.notes_file }}
          generate_release_notes: ${{ steps.notes.outputs.notes_file == '' }}
          files: |
            ${{ steps.artifacts.outputs.installer_path }}
            ${{ steps.artifacts.outputs.portable_path }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Scan release files on VirusTotal
        # Uploads both files to VirusTotal and adds the scan links to the
        # end of the release notes, so users can check the results
        # themselves. Runs only when the VIRUSTOTAL_API_KEY secret is set
        # (a free VirusTotal account's key is enough). A VirusTotal outage
        # never fails a release that is already published.
        if: steps.gate.outputs.skip == 'false' && env.VT_KEY_SET == 'true'
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          update_release_body: true
          request_rate: 4
          files: |
            ${{ steps.artifacts.outputs.installer_path }}
            ${{ steps.artifacts.outputs.portable_path }}
        continue-on-error: true

      - name: Post Discord notification
        # Inlined here because the standalone release-notify.yml workflow
        # — which subscribes to `release: published` — is blocked from
        # firing by GitHub's workflow-loop safety: events triggered by
        # workflows using GITHUB_TOKEN don't trigger downstream
        # workflows. softprops/action-gh-release uses GITHUB_TOKEN, so
        # the publish event it generates can't chain into Discord
        # notification automatically. Calling discord_notify.py
        # directly from the same workflow side-steps the safety net
        # entirely. release-notify.yml is now a manual-recovery tool
        # only (workflow_dispatch).
        if: steps.gate.outputs.skip == 'false'
        shell: pwsh
        run: |
          python -m pip install python-dotenv --quiet
          python scripts/discord_notify.py "${{ steps.resolve.outputs.tag }}"
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        # Don't fail the workflow if Discord posting hits a transient
        # webhook error — the release is already published, that's the
        # primary success criterion. A failed Discord post can be
        # retried via release-notify.yml's workflow_dispatch.
        continue-on-error: true
